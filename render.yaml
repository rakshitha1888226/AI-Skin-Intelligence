services:
  # Backend FastAPI Web Service
  - type: web
    name: skincare-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: skincare-backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skincare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Site (Static sites do not use a plan field)
  - type: web
    name: skincare-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    rootDir: skincare-frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: skincare-backend
          property: host

databases:
  - name: skincare-db
    databaseName: skincare_db
    user: skincare_user
    plan: free
